  "requests (>=2.33.1,<3.0.0)",
  "requests-toolbelt (==1.0.0)",
  "setuptools (<=83.0.0)",
  "shellingham (==1.5.4)",
  "sniffio (==1.3.1)",
  "tomlkit (>=0.14.0,<0.15.0)",
  "trove-classifiers (>=2026.1.14.14,<2027.0.0.0)",
  "typing-extensions (==4.15.0)",
  "urllib3 (>=2.6.0)",
  "virtualenv (>=21.2.0,<22.0.0)",
  "wcwidth (>=0.6.0,<0.7.0)",
  "xattr (>=1.3.0,<2.0.0)",
  "zstandard (==0.25.0)",
  "pip (>=26.0)",
  "ibx-sdk (>=0.7.7,<0.8.0)",
